name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: Python DSP Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt pytest

      - name: Run pytest
        run: |
          pytest research/

  swift-build:
    name: Swift Spikes & Tools Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint --strict

      - name: Generate and build Spikes
        run: |
          cd Spikes
          xcodegen
          for scheme in SpikeA_ActionButtonIntent SpikeB_LockScreenControl SpikeB_LockScreenControlWidgets SpikeC_BackgroundAudio72h SpikeD_NotificationChain SpikeE_BLEAdvertising SpikeF_OutputVolume SpikeG_NightWatchPower SpikeH_SiriOffline SpikeI_AlarmKit; do
            echo "Building $scheme"
            xcodebuild -project SesVerSpikes.xcodeproj -scheme "$scheme" -destination "generic/platform=iOS Simulator" build CODE_SIGNING_ALLOWED=NO
          done

      - name: Run Packages tests
        run: |
          cd Packages
          swift test

      - name: Generate and build Main App (SesVer)
        run: |
          cd App
          xcodegen
          xcodebuild -project SesVer.xcodeproj -scheme SesVer -destination "generic/platform=iOS Simulator" build CODE_SIGNING_ALLOWED=NO

      - name: Generate and build FieldRecorder
        run: |
          cd Tools/FieldRecorder
          xcodegen
          xcodebuild -project FieldRecorder.xcodeproj -scheme FieldRecorder -destination "generic/platform=iOS Simulator" build CODE_SIGNING_ALLOWED=NO
